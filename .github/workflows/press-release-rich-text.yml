name: Press release rich text
on:
  push:
    branches: [codex/press-release-rich-text]
  pull_request:
    paths: ["app/**", "tests/**", "package*.json", "playwright.config.ts", ".github/workflows/press-release-rich-text.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Save dependency lockfile on implementation branch
        if: github.event_name == 'push' && github.ref_name == 'codex/press-release-rich-text'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Lock rich text editor dependencies'
            git push
          fi
      - run: npm ci
      - run: npm run test:press-releases
      - run: npx eslint app/components/pressReleases/PressReleaseEditor.tsx app/components/pressReleases/PressReleaseBody.tsx app/components/pressReleases/PressReleaseForm.tsx app/lib/pressReleases/richText.ts app/lib/pressReleases/services/pressReleaseService.ts app/press-releases/\[id\]/page.tsx app/studio/press-releases/page.tsx tests playwright.config.ts
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: press-release-test-results
          path: test-results/
